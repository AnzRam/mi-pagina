    <!-- FullCalendar -->

    <!-- Mi CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <!-- Barra de navegación -->

            </button>
    
            <!-- Menú -->
            <div class="collapse navbar-collapse" id="menu">
                
                <!-- Enlaces del menú -->
                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="index.html" data-page="index.html">Inicio</a>
                    </li>
                
                    <li class="nav-item">
                        <a class="nav-link" href="servicios.html" data-page="servicios.html">Servicios</a>

                    <li class="nav-item">
                        <a class="nav-link" href="calendario.html" data-page="calendario.html">Calendario</a>
                    </li>

                <!-- Botón -->
                <a href="https://wa.me/522228979077?text=Hola,%20me%20gustaría%20agendar%20una%20sesión%20fotográfica." class="btn btn-primary px-4 rounded-pill" target="_blank"> 
                    <i class="bi bi-whatsapp"></i>
                    Comenzar
                </a>
    
            </div>
    
        </div>
    
    </nav>

    <!-- Calendario -->
    <section class="container-fluid py-5">

        <div class="container">
    
            <div class="text-center mb-5">
    
                <h1 class="fw-bold">Agenda tu sesión</h1>
    
                <p class="text-secondary">
    
                    Selecciona una fecha y completa tu solicitud de reserva.
    
                </p>
    
            </div>
    
            <div class="row g-4">
    
                <!-- Calendario -->
    
                <div class="col-lg-8">
    
                    <div class="calendar-card">
    
                        <div id="calendar"></div>
    
                    </div>
    
                </div>
    
                <!-- Panel lateral -->
    
                <div class="col-lg-4">
    
                    <div class="booking-card">
    
                        <h3 class="mb-4">
    
                            <i class="bi bi-camera-fill"></i>
    
                            Reserva
    
                        </h3>
    
                        <label class="form-label">
    
                            Tipo de sesión
    
                        </label>
    
                        <select class="form-select mb-3">
    
                            <option>Boda</option>
    
                            <option>Graduación</option>
    
                            <option>Pareja</option>
    
                            <option>Familiar</option>
    
                            <option>Infantil</option>
    
                            <option>Evento</option>
    
                        </select>
    
                        <label class="form-label">
    
                            Horario
    
                        </label>
    
                        <select class="form-select mb-3">
    
                            <option>09:00 AM</option>
    
                            <option>10:00 AM</option>
    
                            <option>11:00 AM</option>
    
                            <option>12:00 PM</option>
    
                            <option>03:00 PM</option>
    
                            <option>04:00 PM</option>
    
                        </select>
    
                        <input
                            type="text"
                            class="form-control mb-3"
                            placeholder="Nombre completo">
    
                        <input
                            type="email"
                            class="form-control mb-3"
                            placeholder="Correo electrónico">
    
                        <input
                            type="tel"
                            class="form-control mb-4"
                            placeholder="Teléfono">
    
                        <button class="btn btn-gold w-100">
    
                            Reservar sesión
    
                        </button>
    
                    </div>
    
                </div>
    
            </div>
    
        </div>
    
    </section>

    <!-- Barra inferior -->
    <footer class="footer-bar">

        <div class="container">

            <div class="row align-items-center text-center">

                <div class="col-md-4">
                    <i class="bi bi-telephone-fill"></i>
                    <span>222 123 4567</span>
                </div>

                <div class="col-md-4">
                    <i class="bi bi-envelope-fill"></i>
                    <span>contacto@studiolens.com</span>
                </div>

                <div class="col-md-4">
                    <i class="bi bi-whatsapp"></i>
                    <span>Agenda por WhatsApp</span>
                </div>

            </div>

        </div>

    </footer>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- FullCalendar -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>

    <!-- Mi JavaScript -->
    <script src="js/script.js"></script>
</body>

</html>
